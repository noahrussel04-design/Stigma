<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.T.I.G.M.A</title>
<style>
  /* Placeholder screen. Replace with your own design later. */
  html, body { height: 100%; margin: 0; background: #0b0f14; color: #e6edf3; font: 16px system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; }
  header { padding: 14px 16px; font-weight: 600; letter-spacing: .2em; display: flex; justify-content: space-between; align-items: center; }
  header label { font-size: 13px; letter-spacing: 0; font-weight: 400; }
  #log { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.4; white-space: pre-wrap; }
  .you { align-self: flex-end; background: #1f6feb; }
  .bot { align-self: flex-start; background: #1c232d; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #11161d; color: inherit; font-size: 16px; }
  button { padding: 0 14px; border-radius: 10px; border: 0; background: #1f6feb; color: #fff; font-size: 16px; }
  button.mic { background: #30363d; }
</style>
</head>
<body>
<div id="app">
  <header>S.T.I.G.M.A <label><input type="checkbox" id="voice" checked> Voice</label></header>
  <div id="log"></div>
  <form id="f">
    <button type="button" class="mic" id="mic">Mic</button>
    <input id="t" autocomplete="off" placeholder="Talk to STIGMA">
    <button>Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), t = document.getElementById('t');
let pw = localStorage.getItem('stigma_pw') || '';
const sid = 'phone';

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'm ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function send(text) {
  add('you', text);
  const wait = add('bot', '...');
  const voice = document.getElementById('voice').checked;
  try {
    const r = await fetch(voice ? '/converse' : '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Password': pw },
      body: JSON.stringify({ message: text, session_id: sid })
    });
    if (r.status === 401) {
      pw = prompt('Password?') || ''; localStorage.setItem('stigma_pw', pw);
      wait.textContent = 'Wrong or missing password. Try again.'; return;
    }
    if (!r.ok) { wait.textContent = 'Error: ' + (await r.text()).slice(0, 200); return; }
    if (voice) {
      wait.textContent = r.headers.get('X-Reply') || '';
      new Audio(URL.createObjectURL(await r.blob())).play();
    } else {
      wait.textContent = (await r.json()).reply;
    }
  } catch (e) { wait.textContent = 'Could not reach the server.'; }
  log.scrollTop = log.scrollHeight;
}

document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const v = t.value.trim(); if (!v) return;
  t.value = ''; send(v);
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic');
if (!SR) mic.hidden = true;
else mic.onclick = () => {
  const rec = new SR(); rec.lang = 'en-GB';
  rec.onresult = ev => send(ev.results[0][0].transcript);
  rec.start();
};
</script>
</body>
</html>
